name: Validate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job pushes, comments or releases. Caches and artifacts
# use their own runtime token, not this one.
permissions:
  contents: read

jobs:
  lint-fast:
    name: Lint (clj-kondo)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Pinned to match local dev clj-kondo exactly. Local/CI skew lets code
      # pass `just lint-fast` locally but fail here (or vice versa). When bumping,
      # update this version AND the local install together. See AGENTS.md
      # "Lint version parity".
      - name: Install clj-kondo (pinned)
        env:
          CLJ_KONDO_VERSION: v2026.07.24
          # sha256 of clj-kondo-<version>-linux-static-amd64.zip (the release's .sha256 file)
          CLJ_KONDO_SHA256: 759f5483d224c42e2444fb88adb3718682182a266de0e180a79df451bb243e9c
        run: |
          v="${CLJ_KONDO_VERSION#v}"
          curl -fsSL "https://github.com/clj-kondo/clj-kondo/releases/download/${CLJ_KONDO_VERSION}/clj-kondo-${v}-linux-static-amd64.zip" -o kondo.zip
          echo "${CLJ_KONDO_SHA256}  kondo.zip" | sha256sum -c -
          unzip -o kondo.zip
          sudo install clj-kondo /usr/local/bin/clj-kondo
          clj-kondo --version

      - name: Lint
        run: clj-kondo --lint src --lint test --lint dev --fail-level error

  format:
    name: Format Check
    needs: lint-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Format check
        run: clojure -M:cljfmt check src test dev

  test:
    name: Compile + Unit Tests
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run tests
        run: clojure -M:dev test

  e2e:
    name: E2E Tests
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Install rlwrap
        run: sudo apt-get install -y rlwrap

      - name: Pin Tailwind CSS to v3
        # Biff's auto-download fetches "latest" which is now v4 and breaks our
        # v3-style CSS (@tailwind directives, @apply outside @layer).
        # Pre-place a v3 binary so Biff uses it instead of downloading v4.
        env:
          TAILWIND_VERSION: v3.4.17
          # sha256 of tailwindcss-linux-x64 (the release's sha256sums.txt)
          TAILWIND_SHA256: 7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4
        run: |
          mkdir -p bin
          curl -fL -o bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWIND_SHA256}  bin/tailwindcss" | sha256sum -c -
          chmod +x bin/tailwindcss
          bin/tailwindcss --help | head -2

      - name: Generate CSS before starting dev server
        # Generate CSS synchronously so it exists when the server starts.
        # Biff's async CSS-watcher future is silent in CI; this guarantees the
        # file is present and surfaces any tailwind errors directly.
        run: |
          mkdir -p target/resources/public/css
          bin/tailwindcss \
            -c resources/tailwind.config.js \
            -i resources/tailwind.css \
            -o target/resources/public/css/main.css
          ls -la target/resources/public/css/main.css
          head -3 target/resources/public/css/main.css

      - name: Generate ephemeral secrets
        run: |
          echo "COOKIE_SECRET=$(openssl rand -base64 16)" >> config.env
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> config.env
          # A throwaway credentials key plus the dev-only fake Cronometer API,
          # so test:cronometer connects and syncs end to end. No traffic leaves
          # the runner, and the test fails here if either is missing.
          echo "CREDENTIALS_KEY=$(openssl rand -base64 32)" >> config.env
          echo "FAKE_CRONOMETER=true" >> config.env

      - name: Start dev server
        run: |
          clj -M:dev dev &
          echo "Waiting for server on port 8080..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080 > /dev/null 2>&1; do sleep 2; done'
          echo "Server is up."

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # Discovered, not enumerated: every e2e/scripts/test-*.ts runs here.
      # A hand-maintained list is how test:workout sat unguarded in CI — the
      # test existed and passed locally, but nobody added the line, so the
      # screen it covers broke in real use with a green checkmark on the
      # commit. Adding a test file is now the only step required.
      #
      # To hold one back, name it in E2E_SKIP (space-separated) and say why.
      - name: Run e2e tests
        working-directory: e2e
        env:
          E2E_SKIP: ''
        run: |
          set -euo pipefail

          # A test file with no npm script would otherwise fail deep in the
          # loop with npm's "Missing script"; name all of them up front.
          missing=''
          for file in scripts/test-*.ts; do
            script="test:$(basename "$file" .ts | cut -c6-)"
            grep -q "\"$script\":" package.json || missing="$missing $script"
          done
          if [ -n "$missing" ]; then
            echo "::error::package.json has no npm script for:$missing"
            exit 1
          fi

          for file in scripts/test-*.ts; do
            script="test:$(basename "$file" .ts | cut -c6-)"
            case " $E2E_SKIP " in
              *" $script "*)
                echo "::notice::skipped $script (listed in E2E_SKIP)"
                continue
                ;;
            esac
            echo "::group::$script"
            npm run "$script"
            echo "::endgroup::"
          done

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7
